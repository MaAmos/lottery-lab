name: Diagnose public data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install curl_cffi
      - run: python3 lottery_lab/diagnose_sources.py
