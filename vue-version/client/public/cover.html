<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章封面生成器</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap");

      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify_content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f2f5;
        font-family: "Noto Sans SC", sans-serif;
      }

      .cover-container {
        /* 掘金封面推荐比例 1303 x 734, 这里按 16:9 设计 */
        width: 1280px;
        height: 720px;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 80px;
        color: #fff;
      }

      /* 背景装饰圆圈 */
      .bg-circle {
        position: absolute;
        border-radius: 50%;
        opacity: 0.1;
        filter: blur(60px);
      }

      .circle-1 {
        width: 600px;
        height: 600px;
        background: #42b883; /* Vue Green */
        top: -200px;
        right: -100px;
      }

      .circle-2 {
        width: 500px;
        height: 500px;
        background: #f48120; /* Cloudflare Orange */
        bottom: -150px;
        left: -100px;
      }

      /* 顶部标签栏 */
      .tags {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
      }

      .tag {
        padding: 8px 24px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50px;
        font-size: 24px;
        font-weight: 700;
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .tag-vue {
        color: #42b883;
        border-color: #42b883;
      }
      .tag-cf {
        color: #f48120;
        border-color: #f48120;
      }
      .tag-money {
        color: #fbbf24;
        border-color: #fbbf24;
      }

      /* 主标题 */
      h1 {
        font-size: 96px;
        line-height: 1.1;
        margin: 0 0 30px 0;
        font-weight: 900;
        background: linear-gradient(to right, #ffffff 0%, #e2e8f0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -2px;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      .highlight {
        color: #f48120;
        -webkit-text-fill-color: #f48120;
      }

      /* 副标题 */
      p.subtitle {
        font-size: 36px;
        color: #94a3b8;
        margin: 0;
        font-weight: 400;
        max-width: 800px;
        line-height: 1.5;
      }

      /* 右侧装饰图标区 */
      .tech-icons {
        position: absolute;
        right: 80px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 40px;
        opacity: 0.9;
      }

      .icon-box {
        width: 120px;
        height: 120px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 60px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
      }

      /* 底部装饰条 */
      .bottom-bar {
        position: absolute;
        bottom: 60px;
        left: 80px;
        display: flex;
        align-items: center;
        gap: 20px;
        font-family: "JetBrains Mono", monospace;
        color: #64748b;
        font-size: 20px;
      }

      .code-snippet {
        background: #000;
        padding: 10px 20px;
        border-radius: 8px;
        color: #4ade80;
      }
    </style>
  </head>
  <body>
    <div class="cover-container">
      <!-- 背景光晕 -->
      <div class="bg-circle circle-1"></div>
      <div class="bg-circle circle-2"></div>

      <!-- 顶部标签 -->
      <div class="tags">
        <div class="tag tag-vue">Vue 3</div>
        <div class="tag tag-cf">Cloudflare</div>
        <div class="tag tag-money">Serverless</div>
      </div>

      <!-- 主标题 -->
      <h1>零成本<br /><span class="highlight">全栈开发</span>实战</h1>

      <!-- 副标题 -->
      <p class="subtitle">
        无需服务器，一行命令上线 AI 彩票助手<br />Vue3 + Workers + D1 +
        广告变现完整指南
      </p>

      <!-- 右侧图标 (模拟 Logo) -->
      <div class="tech-icons">
        <div class="icon-box" style="color: #42b883">V</div>
        <!-- Vue -->
        <div class="icon-box" style="color: #f48120">C</div>
        <!-- Cloudflare -->
        <div class="icon-box" style="color: #61dafb">D1</div>
        <!-- DB -->
      </div>

      <!-- 底部代码装饰 -->
      <div class="bottom-bar">
        <span>></span>
        <div class="code-snippet">npm run deploy</div>
        <span>_</span>
      </div>
    </div>
  </body>
</html>
